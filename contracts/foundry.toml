[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# The deploy writes a candidate under broadcast/; the promotion reads it and the receipts, then writes config/.
fs_permissions = [
    { access = "read-write", path = "./config" },
    { access = "read-write", path = "./broadcast" },
    # MainnetRunbook.t.sol (PROD-GATE-007) checks the runbook against R7 and the scripts it names.
    { access = "read", path = "./script" },
    { access = "read", path = "./SURFACE.md" },
    { access = "read", path = "../docs/mainnet-runbook.md" },
    { access = "read", path = "../scripts/preflight-prod.ts" },
    { access = "read", path = "../package.json" },
    { access = "read", path = "../apps/api/src/prod-config.ts" },
]
solc_version = "0.8.28"
evm_version = "cancun"
# Monad network mode (Foundry >= 1.8): required to fork Monad in the fork tests.
network = "monad"
optimizer = true
optimizer_runs = 200
# The 15-field Listing getter and the Published event exceed the legacy stack; via-IR is the usual fix.
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Monad verification wants metadata present but unhashed (docs.monad.xyz/guides/verify-smart-contract/foundry).
# Foundry's own keys: the CBOR metadata stays, without a source hash, so the bytecode does not depend on file paths.
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
